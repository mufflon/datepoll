<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <path id="h1" d="M28 20 C24 10 9 10 8 23"/>
    <path id="h2" d="M8 23 C7 35 16 42 22 37"/>
    <path id="h3" d="M22 37 C26 33 23 27 18 29"/>
    <clipPath id="face">
      <path id="f" d="M24 21 C24 15 40 15 40 21 C40 27 39 33 37.5 41 C36.5 49 35 55 32 55 C29 55 27.5 49 26.5 41 C25 33 24 27 24 21 Z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1f7a4a"/>
  <!-- Horns, thinning toward the tip; the dashed overlay draws the ridges. -->
  <g id="horn" fill="none" stroke-linecap="round">
    <g stroke="#e8d6ac">
      <use href="#h1" stroke-width="7.5"/>
      <use href="#h2" stroke-width="6.5"/>
      <use href="#h3" stroke-width="5"/>
    </g>
    <g stroke="#d3ba85" stroke-linecap="butt" stroke-dasharray="0.8 3.4">
      <use href="#h1" stroke-width="7.5"/>
      <use href="#h2" stroke-width="6.5"/>
      <use href="#h3" stroke-width="5"/>
    </g>
  </g>
  <use href="#horn" transform="matrix(-1 0 0 1 64 0)"/>
  <!-- Face: chestnut with a pale muzzle. -->
  <use href="#f" fill="#c98d5a"/>
  <rect x="20" y="44" width="24" height="14" fill="#f4ecd9" clip-path="url(#face)"/>
  <g fill="#ecdcc0">
    <circle cx="28.3" cy="29.5" r="2.1"/>
    <circle cx="35.7" cy="29.5" r="2.1"/>
  </g>
  <g fill="#2b1d14">
    <circle cx="28.3" cy="29.5" r="1.25"/>
    <circle cx="35.7" cy="29.5" r="1.25"/>
    <ellipse cx="30.2" cy="50.5" rx="0.9" ry="1.3"/>
    <ellipse cx="33.8" cy="50.5" rx="0.9" ry="1.3"/>
  </g>
</svg>
